<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Protect the supplied admin routes without modifying application code.
    <Location "/">
        AuthType Basic
        AuthName "TET Administration"
        AuthUserFile /var/lib/tet/admin.htpasswd
        <RequireAny>
            Require expr "%{THE_REQUEST} =~ m#\s/(?:api(?:/|\?|\s)|up(?:\?|\s)|storage/|build/)#"
            Require valid-user
        </RequireAny>
    </Location>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
