<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Protect the supplied admin routes without modifying application code.
    <LocationMatch "^/(?!api(?:/|$)|up$|storage/|build/)">
        AuthType Basic
        AuthName "TET Administration"
        AuthUserFile /var/lib/tet/admin.htpasswd
        Require valid-user
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
